<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Converter Moeda</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <form action="/converter_moeda" method="post">

        <h1>Conversor de  Moedas</h1>

        <label>Digite o valor em reais</label>
        <input type="number" id="reais" name="reais" step="0.01" required>


        <button type="submit">Calcular Valor</button>

    </form>

    {% if dolar%}
    <div class="resultado">
        <h2>Resultado da Conversão</h2>
        <p><strong>Você tem:</strong> {{ dolar }} de doláres</p>

    </div>
    {%endif%}

</div>

</body>
</html>
