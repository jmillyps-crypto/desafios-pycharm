<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Temperatura</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <form action="/converter_temperatura" method="post">

        <h1>Converter Temperatura</h1>

        <label>Digite o valor em celsius</label>
        <input type="number" id="celsius" name="celsius" step="0.01" required>


        <button type="submit">Calcular Temperatura</button>

    </form>

    {% if fahrenheit%}
        <div class="resultado">
            <h2>Resultado da Conversão</h2>
            <p><strong>A temperatura é:</strong> {{ fahrenheit }} fahrenheit</p>
        </div>
    {%endif%}

</div>

</body>
</html>
