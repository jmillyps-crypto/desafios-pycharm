<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calcular Idade</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <form action="/calcular_idade" method="post">

        <h1>Calculadora de Idade</h1>


        <label>Digite seu ano de nascimento</label>
        <input type="number" id="ano" name="ano" step="0.01" required>


        <button type="submit">Calcular Idade</button>

    </form>

    {% if idade%}
    <div class="resultado">
        <h2>Resultado da Idade</h2>
        <p><strong>Você tem:</strong> {{ idade }} anos</p>

    </div>
    {%endif%}

</div>

</body>
</html>
